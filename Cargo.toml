[package]
name = "dig"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
globset = "=0.4.14"
ignore = "=0.4.18"
libc = "0.2.189"
memchr = "2.8.3"
memmap2 = "0.9.11"
regex = "1.10"
sysinfo = { version = "=0.29.11", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
